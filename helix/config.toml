theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
bufferline = "multiple"
true-color = true

[editor.lsp]
display-inlay-hints = true

[editor.indent-guides]
render = true
character = "▏"

[keys.normal]
C-p = ':sh tmux display-popup -E -w 90%% -h 90%% -d "$(dirname "$(realpath %{buffer_name})")" '
C-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-j = ["extend_to_line_bounds", "delete_selection",  "paste_after"]
C-e = [
  ':sh rm -f /tmp/hx-yazi',
  ':sh tmux display-popup -E -w 90%% -h 90%% -d "$(dirname "$(realpath %{buffer_name})")" "yazi \"%{buffer_name}\" --chooser-file=/tmp/hx-yazi"',
  ':open %sh{cat /tmp/hx-yazi}',
]
# C-e = [
#   ':sh rm -f /tmp/hx-yazi',
#   ':sh tmux display-popup -E -w 90%% -h 90%% -d "$(dirname "$(realpath %{buffer_name})")" "yazi --chooser-file=/tmp/hx-yazi"',
#   ':open %sh{cat /tmp/hx-yazi}',
# ]
[keys.normal.space]
F = "file_picker_in_current_buffer_directory"
f = "file_picker_in_current_directory"

[keys.select.space]
F = "file_picker_in_current_buffer_directory"
f = "file_picker_in_current_directory"
