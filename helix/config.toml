theme = "catppuccin_mocha" #catppuccin_mocha

[editor]
shell = ["fish","-c"]
line-number = "relative"
cursorline = true
bufferline = "multiple"
true-color = true
completion-timeout = 5
continue-comments = false
end-of-line-diagnostics = "disable"
clipboard-provider = "wayland"
# popup-border = "popup"
[editor.word-completion]
enable = true
trigger-length = 1

[editor.lsp]
display-inlay-hints = false
snippets = true

[editor.inline-diagnostics]
cursor-line= "disable" 
other-lines = "disable"
prefix-len = 1
max-wrap = 20
max-diagnostics = 10

[editor.indent-guides]
render = true
character = "▏"

[keys.normal]
C-p = ':sh tmux display-popup -E -w 90%% -h 90%% -d "$(dirname "$(realpath %{buffer_name})")" '
C-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-j = ["extend_to_line_bounds", "delete_selection",  "paste_after"]
C-e = [
  ':pipe-to ~/dotfiles/myscripts/yazi_wrapper.sh %{buffer_name}',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/hx-yazi}',
  ':redraw',
]
A-k = "increment"
A-j = "decrement"
H = ":bp"
L = ":bn"
A-d = ":bc"
C-o = ":toggle lsp.display-inlay-hints"
C-r = ':sh tmux display-popup -E -w 90%% -h 90%% -d (dirname (realpath %{buffer_name})) fish -C "ruf"'
# [keys.normal.y]
# y = ["extend_to_line_bounds","yank","collapse_selection"]
# [keys.normal.y]
# y = ["save_selection", "extend_to_line_bounds", "yank", "jump_backward"]


[keys.normal.space]
F = "file_picker_in_current_buffer_directory"
f = "file_picker_in_current_directory"
u = "switch_case"
# l = "switch_to_lowercase"
l = ":lsp-restart"
U = "switch_to_uppercase"
w = ":w"
q = ":q"
o = ":config-reload"

# e = [
#   ':pipe-to ~/dotfiles/myscripts/yazi_wrapper.sh %{buffer_name}',
#   ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
#   ':open %sh{cat /tmp/hx-yazi}',
#   ':redraw',
# ]


[keys.select.space]
F = "file_picker_in_current_buffer_directory"
f = "file_picker_in_current_directory"
u = "switch_case"
l = "switch_to_lowercase"
U = "switch_to_uppercase"
