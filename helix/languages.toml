[language-server.hx-lsp]
command = "hx-lsp"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "nix"
language-servers = ["nixd","hx-lsp","harper-ls"]
auto-format = true
formatter = { command = "alejandra" }

[[language]]
name = "c"
language-servers = ["clangd"]

[language-server.scls]
command = "simple-completion-language-server"
[language-server.scls.config]
max_completion_items = 20
snippets_first = true
snippets_inline_by_word_tail = false
feature_words = true
feature_snippets = true
feature_unicode_input = false
feature_paths = false
feature_citations = false

[[language]]
name = "toml"
# language-servers = ["scls"]

[[language]]
name = "text"
scope = "text.plain"
file-types = ["txt"]
# language-servers = []
# [language-server.pyrefly]
# command = "pyrefly"
# args = ["lsp"]
# [language-server.pyrefly.config.python.analysis.inlayHints]
# callArgumentNames = "all"
# functionReturnTypes = true
# variableTypes = true
# pytestParameters = true

[[language]]
name = "python"
language-servers = ["basedpyright" , "ruff","hx-lsp","harper-ls"] #based pyright
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

[[language]]
name = "rust"
language-servers = ["rust-analyzer","hx-lsp","harper-ls"]
formatter = { command = "rustfmt" }
[language-server.rust-analyzer.config]
check.command = "clippy"

[[language]]
name = "go"
language-servers = ["gopls","golangci-lint","hx-lsp","harper-ls"]
formatter = { command = "goimports" }
auto-format = true

[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2", "-ci" ]}
language-servers = ["bash-language-server","shellcheck","hx-lsp","harper-ls"]

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]


[[language]]
name = "markdown"
language-servers = ["marksman","hx-lsp"]
word-completion.trigger-length = 2

[language-server.jdtls]
command = "jdtls"

[[language]]
name = "java"
language-servers = ["scls","jdtls","harper-ls"]
formatter = { command = "google-java-format", args = ["-"]}
