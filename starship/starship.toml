format = """
[░▒▓](#73986B)\
[ ](bg:#73986B fg:#0D1216)\
[](bg:#7096AA fg:#73986B)\
$directory\
[](fg:#7096AA bg:#93979a)\
$git_branch\
$git_status\
[](fg:#93979a bg:#0D1216)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#0D1216 bg:#93979a)\
$time\
[ ](fg:#93979a)\
\n$character"""

[directory]
style = "fg:#d2d9dd bg:#7096AA"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#93979a"
format = '[[ $symbol $branch ](fg:#7096AA bg:#93979a)]($style)'

[git_status]
style = "bg:#93979a"
format = '[[($all_status$ahead_behind )](fg:#7096AA bg:#93979a)]($style)'

[nodejs]
symbol = ""
style = "bg:#0D1216"
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[rust]
symbol = ""
style = "bg:#0D1216"
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[golang]
symbol = ""
style = "bg:#0D1216"
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[php]
symbol = ""
style = "bg:#0D1216"
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#93979a"
format = '[[  $time ](fg:#d2d9dd bg:#93979a)]($style)'

[python]
symbol = ""
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[c]
symbol = ""
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[java]
symbol = ""
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

[shell]
symbol = ""
format = '[[ $symbol ($version) ](fg:#7096AA bg:#0D1216)]($style)'

