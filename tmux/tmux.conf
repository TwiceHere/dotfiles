# ── nix options ──────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g default-shell "/home/sonu/.nix-profile/bin/fish"
set -g history-limit 5000
set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── sensible (what it actually changes at your settings) ─
set -sg escape-time 0
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.tmux.conf \; display-message "Sourced ~/.tmux.conf"

# ── yank (OSC52 instead of xclip/wl-copy) ────────────
set -g set-clipboard on

# ── your config ──────────────────────────────────────
set -g status off
bind e set-option status

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

bind -n C-d detach-client
set -g allow-passthrough all

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r refresh-client
bind Enter display-popup -d "#{pane_current_path}" -E -w 90% -h 90%

# ── transparency (same overrides as before) ──────────
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-style bg=default
set -g pane-active-border-style bg=default
set -g status-style bg=default
set -g popup-style "bg=default,fg=default"

# ── catppuccin mocha: what the plugin set that you didn't override ─
set -g mode-style "bg=#313244,bold"
set -g message-style "fg=#94e2d5,bg=#6c7086,fill=#6c7086"
set -g message-command-style "fg=#94e2d5,bg=#6c7086,fill=#6c7086"
set -g clock-mode-colour "#89b4fa"
set -g window-status-activity-style "bg=#b4befe,fg=#11111b"
set -g window-status-bell-style "bg=#f9e2af,fg=#11111b"
%if "#{>=:#{version},3.4}"
set -g menu-selected-style "fg=#cdd6f4,bold,bg=#6c7086"
set -g popup-border-style "fg=#45475a"
%endif

# ── status bar ───────────────────────────────────────
set -g automatic-rename off
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left-length 50
set -g status-right-length 100

# glyphs: left cap, right cap, application icon, session icon (swap icons, see below)
set -g @cl "\ue0b6"
set -g @cr "\ue0b4"
set -g @ia "\uf120"
set -g @is "\uf007"

# status-left: identical to your original, glyphs injected
set -g status-left "#[fg=#11111b,bg=#cba6f7]#[fg=#181825,reverse]#{@cl}#[none]#I #[fg=#cdd6f4,bg=#45475a] #W#[fg=#181825,reverse]#{@cr}#[none]"

# status-right: catppuccin application (maroon) + session (green, red on prefix)
set -g status-right "#[fg=#eba0ac,bg=#181825]#{@cl}#[fg=#11111b,bg=#eba0ac]#{@ia} #[fg=#cdd6f4,bg=#313244] #W#[fg=#313244,bg=#181825]#{@cr} #[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=#181825]#{@cl}#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#a6e3a1}]#{@is} #[fg=#cdd6f4,bg=#313244] #S#[fg=#313244,bg=#181825]#{@cr}"
